<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
    aria-label="Rolling Alarm concept 02 rolling sphere">
    <defs>
        <radialGradient id="ball" cx="38%" cy="34%" r="55%">
            <stop offset="0%" stop-color="#A8C9C2" />
            <stop offset="55%" stop-color="#6B9A92" />
            <stop offset="100%" stop-color="#3E615B" />
        </radialGradient>
        <clipPath id="sq">
            <rect width="512" height="512" rx="112" />
        </clipPath>
    </defs>
    <g clip-path="url(#sq)">
        <rect width="512" height="512" fill="#0A0A0A" />
        <!-- Motion trails -->
        <rect x="72" y="248" width="96" height="16" rx="8" fill="#4A4766" opacity="0.55" />
        <rect x="72" y="280" width="64" height="12" rx="6" fill="#4A4766" opacity="0.35" />
        <rect x="72" y="220" width="48" height="10" rx="5" fill="#4A4766" opacity="0.3" />
        <!-- Rolling ball -->
        <circle cx="320" cy="256" r="110" fill="url(#ball)" />
        <!-- Coral equator stripe = next fire -->
        <ellipse cx="320" cy="256" rx="108" ry="28" fill="none" stroke="#C17F74" stroke-width="14" />
        <circle cx="280" cy="210" r="22" fill="#D4D2CF" opacity="0.25" />
    </g>
</svg>