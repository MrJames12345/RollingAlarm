<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
    aria-label="Rolling Alarm concept 10 stacked bars">
    <defs>
        <clipPath id="sq">
            <rect width="512" height="512" rx="112" />
        </clipPath>
    </defs>
    <g clip-path="url(#sq)">
        <rect width="512" height="512" fill="#0A0A0A" />
        <!-- Equalizer / interval stack: past, present, next -->
        <rect x="96" y="300" width="72" height="100" rx="16" fill="#4A4766" />
        <rect x="196" y="220" width="72" height="180" rx="16" fill="#6B9A92" opacity="0.55" />
        <rect x="296" y="140" width="72" height="260" rx="16" fill="#6B9A92" />
        <!-- Rising coral bar = next alarm -->
        <rect x="396" y="100" width="40" height="40" rx="12" fill="#C17F74" />
        <!-- Floor line -->
        <rect x="80" y="412" width="352" height="14" rx="7" fill="#D4D2CF" opacity="0.2" />
    </g>
</svg>