<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
    aria-label="Rolling Alarm orbital logo concept">
    <defs>
        <!-- Brand tokens from RA_ColourStyles -->
        <!-- sage #6B9A92, coral #C17F74, indigo #4A4766, scaffold #0A0A0A, warm white #D4D2CF -->

        <radialGradient id="bgGlow" cx="50%" cy="46%" r="58%">
            <stop offset="0%" stop-color="#161616" />
            <stop offset="70%" stop-color="#0A0A0A" />
            <stop offset="100%" stop-color="#050505" />
        </radialGradient>

        <linearGradient id="sageTube" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8BB5AD" />
            <stop offset="45%" stop-color="#6B9A92" />
            <stop offset="100%" stop-color="#557E77" />
        </linearGradient>

        <linearGradient id="coralTube" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#A86A60" />
            <stop offset="50%" stop-color="#C17F74" />
            <stop offset="100%" stop-color="#D4958A" />
        </linearGradient>

        <linearGradient id="indigoTrack" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#5A5678" />
            <stop offset="100%" stop-color="#3A3752" />
        </linearGradient>

        <filter id="sageGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="coralGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" />
        </filter>

        <!-- Squircle clip matching app-icon silhouette -->
        <clipPath id="squircle">
            <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
        </clipPath>
    </defs>

    <g clip-path="url(#squircle)">
        <rect width="512" height="512" fill="url(#bgGlow)" />

        <!-- Quiet outer orbit: sleep indigo track (full cycle) -->
        <circle
            cx="256"
            cy="256"
            r="148"
            fill="none"
            stroke="url(#indigoTrack)"
            stroke-width="18"
            stroke-opacity="0.55"
            filter="url(#softBlur)"
        />

        <!-- Rolling sage arc: the interval in motion (H270� open dial) -->
        <path
            d="M 360.7 151.3
         A 148 148 0 1 1 151.3 360.7"
            fill="none"
            stroke="url(#sageTube)"
            stroke-width="28"
            stroke-linecap="round"
            filter="url(#sageGlow)"
        />

        <!-- Inner ghost arc: depth / nested cycle -->
        <path
            d="M 332.5 179.5
         A 108 108 0 1 1 179.5 332.5"
            fill="none"
            stroke="#6B9A92"
            stroke-opacity="0.28"
            stroke-width="14"
            stroke-linecap="round"
        />

        <!-- Leading coral bead: next-alarm marker on the rolling tip -->
        <g filter="url(#coralGlow)" transform="rotate(-45 256 256)">
            <!-- Capsule riding the orbit at ~1:30 -->
            <rect
                x="372"
                y="242"
                width="52"
                height="28"
                rx="14"
                ry="14"
                fill="url(#coralTube)"
            />
            <!-- Soft highlight on the bead -->
            <rect
                x="380"
                y="248"
                width="22"
                height="8"
                rx="4"
                ry="4"
                fill="#D4D2CF"
                fill-opacity="0.22"
            />
        </g>

        <!-- Quiet hub: clock centre without clutter -->
        <circle cx="256" cy="256" r="18" fill="#D4D2CF" fill-opacity="0.12" />
        <circle cx="256" cy="256" r="8" fill="#6B9A92" fill-opacity="0.55" />
    </g>
</svg>