<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rolling Alarm concept 08 split panels">
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <!-- Split field: calm vs ring -->
    <rect width="256" height="512" fill="#6B9A92"/>
    <rect x="256" width="256" height="512" fill="#C17F74"/>
    <!-- Dark mark cut across both halves -->
    <circle cx="256" cy="256" r="96" fill="#0A0A0A"/>
    <rect x="232" y="120" width="48" height="160" rx="24" fill="#0A0A0A"/>
    <!-- Small warm white eye -->
    <circle cx="256" cy="256" r="28" fill="#D4D2CF"/>
  </g>
</svg>
