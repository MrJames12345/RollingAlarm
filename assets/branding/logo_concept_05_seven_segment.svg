<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rolling Alarm concept 05 seven segment countdown">
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#0A0A0A"/>
    <!-- Digital countdown glyph (clinical instrument) -->
    <g fill="#6B9A92">
      <!-- top -->
      <rect x="170" y="120" width="172" height="36" rx="8"/>
      <!-- upper L/R -->
      <rect x="146" y="148" width="36" height="100" rx="8"/>
      <rect x="330" y="148" width="36" height="100" rx="8"/>
      <!-- middle -->
      <rect x="170" y="240" width="172" height="32" rx="8"/>
      <!-- lower L -->
      <rect x="146" y="264" width="36" height="100" rx="8"/>
      <!-- bottom -->
      <rect x="170" y="356" width="172" height="36" rx="8"/>
    </g>
    <!-- Missing lower-right = unfinished cycle; coral colon dots as next fire -->
    <circle cx="400" cy="200" r="16" fill="#C17F74"/>
    <circle cx="400" cy="300" r="16" fill="#C17F74"/>
  </g>
</svg>
