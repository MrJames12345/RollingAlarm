<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
    aria-label="Rolling Alarm concept 03 hourglass interval">
    <defs>
        <clipPath id="sq">
            <rect width="512" height="512" rx="112" />
        </clipPath>
    </defs>
    <g clip-path="url(#sq)">
        <rect width="512" height="512" fill="#0A0A0A" />
        <!-- Hourglass = measured interval of time -->
        <path fill="#6B9A92"
            d="
      M140 120 H372 L280 230
      C268 244 268 268 280 282
      L372 392 H140 L232 282
      C244 268 244 244 232 230 Z" />
        <!-- Coral sand at pinch = imminent fire -->
        <circle cx="256" cy="256" r="22" fill="#C17F74" />
        <rect x="236" y="300" width="40" height="56" rx="12" fill="#C17F74" opacity="0.85" />
    </g>
</svg>