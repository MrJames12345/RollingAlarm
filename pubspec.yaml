name: rolling_alarm
description: A rolling interval alarm app for Android.
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.6
  android_alarm_manager_plus: ^5.1.1
  flutter_local_notifications: ^22.2.0
  permission_handler: ^12.0.3
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  home_widget: ^0.10.0
  purchases_flutter: ^11.0.0
  pdf: ^3.13.0
  printing: ^5.15.0
  google_fonts: ^8.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  path: ^1.9.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  # E2E: Patrol native automation + Flutter integration_test screenshots.
  patrol: ^4.8.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/default_alarm.mp3
    - assets/branding/
    - assets/fonts/

patrol:
  app_name: Rolling Alarm
  android:
    package_name: com.casellaweb.rolling_alarm
    flavor: null
